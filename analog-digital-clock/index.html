<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Analog and Digital Clock</title>
  </head>
  <body>
    <main>
      <h1>Analog Clock</h1>
      <div class="clock analog" aria-label="Current time shown on an analog clock">
        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>
      </div>
      <div class="clock digital hidden" role="timer" aria-live="off"></div>
      <button type="button" id="toggle-clock">Switch to digital clock</button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
